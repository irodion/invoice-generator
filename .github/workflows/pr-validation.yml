name: PR Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scan:
    name: Security Scan (vet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Run vet security scan BEFORE npm ci to prevent install-time attacks
      # Vet can scan package-lock.json directly without installing dependencies
      - name: Run vet security scan
        uses: safedep/vet-action@59b31472804fb53a689468e856c65bdfb84275b3 # v1
        with:
          # Fail on critical vulnerabilities
          policy: |
            name: default
            rules:
              - name: block-critical-vulns
                filter: |
                  vulns.critical.exists(v, true)
                action: deny
                message: "Package has critical vulnerabilities"
              - name: block-high-vulns
                filter: |
                  vulns.high.exists(v, true)
                action: warn
                message: "Package has high severity vulnerabilities"
              - name: block-malware
                filter: |
                  pkg.malicious == true
                action: deny
                message: "Package is flagged as malicious"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test
