name: Create Release

# Controls when the workflow will run
on:
  # Trigger on push to main/master branch
  push:
    branches: [ main, master ]
    # Optionally, only run when specific files change
    paths:
      - 'build/**'
      - 'src/**'
      - 'templates/**'
      - 'appsscript.json'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Run security scan with vet BEFORE npm ci to prevent install-time attacks
      # Vet can scan package-lock.json directly without installing dependencies
      - name: Security scan with vet
        uses: safedep/vet-action@59b31472804fb53a689468e856c65bdfb84275b3 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy: |
            name: release-policy
            rules:
              - name: block-critical-vulns
                filter: |
                  vulns.critical.exists(v, true)
                action: deny
                message: "Package has critical vulnerabilities - blocking release"
              - name: block-malware
                filter: |
                  pkg.malicious == true
                action: deny
                message: "Package is flagged as malicious - blocking release"

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the project (if needed)
      - name: Build project
        run: npm run build

      # Create a ZIP file of the build directory
      - name: Create ZIP file
        run: |
          cd build
          zip -r ../invoice-generator-build.zip .
          cd ..

      # Generate version number from date and commit short hash
      - name: Generate version number
        id: version
        run: echo "version=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

        # For local testing only
      - name: Create Release (Local Test)
        if: ${{ env.ACT }}
        run: |
          echo "Would create release with tag: v${{ steps.version.outputs.version }}"
          echo "Would upload: invoice-generator-build.zip"

      # This will only run on GitHub, not locally with Act
      # Create a GitHub release
      - name: Create Release
        if: ${{ !env.ACT }}
        id: create_release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            # Invoice Generator Release

            Automated release of the Google Sheets Invoice Generator.

            ## Installation

            1. Download the ZIP file
            2. Extract the contents
            3. Follow the instructions in the README.md

            ## Changes in this release

            ${{ github.event.head_commit.message }}
          files: |
            invoice-generator-build.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
