<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        text-align: center;
      }
      .success-icon {
        font-size: 48px;
        color: #4caf50;
        margin-bottom: 15px;
      }
      h2 {
        color: #333;
        margin-bottom: 20px;
      }
      .details {
        text-align: left;
        background: #f5f5f5;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .details p {
        margin: 8px 0;
        word-break: break-all;
      }
      .details strong {
        color: #555;
      }
      .open-btn {
        display: inline-block;
        background-color: #1a73e8;
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
        margin-bottom: 10px;
      }
      .open-btn:hover {
        background-color: #1557a0;
      }
      .close-btn {
        display: block;
        margin-top: 15px;
        color: #666;
        cursor: pointer;
        border: none;
        background: none;
        font-size: 14px;
      }
      .close-btn:hover {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="success-icon">✓</div>
    <h2>Invoice Generated Successfully!</h2>
    <div class="details">
      <p><strong>Location:</strong> <?= folderPath ?></p>
      <p><strong>File:</strong> <?= fileName ?></p>
    </div>
    <a href="<?= fileUrl ?>" target="_blank" rel="noopener noreferrer" class="open-btn">Open Invoice</a>
    <button class="close-btn" onclick="google.script.host.close()">Close (Esc)</button>

    <script>
      // Close dialog on Esc key press
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          google.script.host.close();
        }
      });
    </script>
  </body>
</html>
